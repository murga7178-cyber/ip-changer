plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ipchanger.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ipchanger.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding = "UTF-8"
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
